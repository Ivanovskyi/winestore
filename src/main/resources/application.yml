spring:
  application:
    name: winestore
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/winestore}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: 1h
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  cache:
    wine-ttl: 10m
    search-ttl: 2m
